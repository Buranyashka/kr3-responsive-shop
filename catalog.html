<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonsai Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js" defer></script>
  <script src="js/catalog.js" defer></script>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Bonsai Shop">
  <meta property="og:description" content="Интернет-магазин бонсаев.">
  <meta property="og:image" content="https://Buranyashka.github.io/kr3-html-css-shop/images/preview.jpg">

</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html" style="font-size: 32px">Bonsai Shop</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="order.html">Заявка</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog-layout">
      <aside class="catalog-filters">
        <h2>Фильтры</h2>

        <form class="filters-form" action="#" method="get">
          <fieldset>
            <legend>Категория</legend>

            <label>
              <input type="checkbox" name="category" value="all">
              Все товары
            </label>

            <label>
              <input type="checkbox" name="category" value="popular">
              Популярные
            </label>

            <label>
              <input type="checkbox" name="category" value="new">
              Новинки
            </label>
          </fieldset>

          <fieldset>
            <legend>Цена</legend>

            <label for="price-from">От</label>
            <input id="price-from" name="price-from" type="number" min="0" placeholder="0">

            <label for="price-to">До</label>
            <input id="price-to" name="price-to" type="number" min="0" placeholder="5000">
          </fieldset>

          <button class="button" type="submit">Применить</button>
        </form>
      </aside>

      <section class="catalog-products">
        <h2>Список товаров</h2>
        <div class="products-grid"></div>
        </div>
      </section>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
</body>
</html>
